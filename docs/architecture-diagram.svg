<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VeriCargo OneTruth architecture</title>
  <desc id="desc">CoCo-assisted delivery lifecycle above a Snowflake-native supply-chain runtime that ingests synthetic operational data and shipping documents, produces governed metrics and document evidence, powers an agent and Streamlit control tower, and creates confirmed human-review cases.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f7f"/>
      <stop offset="1" stop-color="#0b57d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6f8298"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b57d0"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font: 700 12px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.6px; }
      .section { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 16px Inter, "Segoe UI", Arial, sans-serif; fill: #172238; }
      .node-copy { font: 400 12px Inter, "Segoe UI", Arial, sans-serif; fill: #637083; }
      .tech { font: 700 12px "SFMono-Regular", Consolas, monospace; fill: #0b57d0; }
      .flow { fill: none; stroke: #6f8298; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #0b57d0; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .flow-dashed { fill: none; stroke: #0b57d0; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <circle cx="1450" cy="54" r="170" fill="#0b57d0" opacity="0.035"/>
  <circle cx="1515" cy="12" r="92" fill="#f28c28" opacity="0.06"/>

  <!-- Brand and title -->
  <g transform="translate(58 38)">
    <path d="M10 16 34 3l24 13-24 14z" fill="#f28c28"/>
    <path d="M10 16v28l24 14V30z" fill="#e97919"/>
    <path d="M58 16v28L34 58V30z" fill="#ffab4a"/>
    <path d="m24 37 7 7 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="68" class="sans" font-size="32" font-weight="800"><tspan fill="#f28c28">Veri</tspan><tspan fill="#172238">Cargo</tspan><tspan fill="#0b57d0"> OneTruth</tspan></text>
  <text x="132" y="94" class="sans" font-size="15" fill="#637083">Governed supply-chain ontology &amp; exception copilot</text>
  <g transform="translate(1268 48)">
    <rect width="274" height="42" rx="21" fill="#fff" stroke="#dbe3ec"/>
    <circle cx="23" cy="21" r="7" fill="#16865e"/>
    <text x="40" y="26" class="sans" font-size="13" font-weight="700" fill="#36465a">SNOWFLAKE-NATIVE RUNTIME</text>
  </g>

  <!-- CoCo delivery lifecycle -->
  <g filter="url(#softShadow)">
    <rect x="58" y="118" width="1484" height="82" rx="18" fill="#fff" stroke="#dbe3ec"/>
  </g>
  <rect x="58" y="118" width="8" height="82" rx="4" fill="#f28c28"/>
  <text x="88" y="146" class="eyebrow" fill="#e97919">COCO DELIVERY LIFECYCLE</text>
  <text x="88" y="174" class="sans" font-size="14" fill="#637083">CoCo helps the team create and prove the solution; Snowflake runs it in production.</text>
  <g class="sans" font-size="13" font-weight="700" fill="#172238">
    <g transform="translate(675 143)"><circle r="18" fill="#fff4e8" stroke="#f28c28"/><text x="-4" y="5" fill="#e97919">1</text><text x="30" y="5">PLAN</text></g>
    <path d="M764 143h47" stroke="#c7d3df" stroke-width="2"/>
    <g transform="translate(834 143)"><circle r="18" fill="#edf5ff" stroke="#0b57d0"/><text x="-4" y="5" fill="#0b57d0">2</text><text x="30" y="5">BUILD</text></g>
    <path d="M929 143h47" stroke="#c7d3df" stroke-width="2"/>
    <g transform="translate(999 143)"><circle r="18" fill="#edf5ff" stroke="#0b57d0"/><text x="-4" y="5" fill="#0b57d0">3</text><text x="30" y="5">DEPLOY</text></g>
    <path d="M1108 143h47" stroke="#c7d3df" stroke-width="2"/>
    <g transform="translate(1178 143)"><circle r="18" fill="#edf5ff" stroke="#0b57d0"/><text x="-4" y="5" fill="#0b57d0">4</text><text x="30" y="5">TEST</text></g>
    <path d="M1266 143h47" stroke="#c7d3df" stroke-width="2"/>
    <g transform="translate(1336 143)"><circle r="18" fill="#eef8f4" stroke="#16865e"/><text x="-4" y="5" fill="#16865e">5</text><text x="30" y="5">AUTOMATE</text></g>
  </g>

  <!-- Runtime frame -->
  <text x="58" y="235" class="section" fill="#637083">RUNTIME ARCHITECTURE</text>
  <rect x="58" y="249" width="1484" height="468" rx="24" fill="#fff" stroke="#dbe3ec" filter="url(#shadow)"/>
  <rect x="348" y="270" width="930" height="426" rx="20" fill="url(#snow)" stroke="#9dc9ec" stroke-width="1.5"/>
  <g transform="translate(374 286)">
    <path d="M0 13c9-17 19-17 28 0 9-17 19-17 28 0-9 17-19 17-28 0C19 30 9 30 0 13Z" fill="#29a8e0" opacity="0.95"/>
    <text x="69" y="18" class="eyebrow" fill="#147aa7">SNOWFLAKE GOVERNED DATA &amp; AI PLATFORM</text>
  </g>

  <!-- Input cards -->
  <text x="84" y="292" class="eyebrow" fill="#637083">SYNTHETIC + USER INPUTS</text>
  <g filter="url(#softShadow)">
    <rect x="84" y="323" width="224" height="102" rx="14" fill="#fff" stroke="#dbe3ec"/>
    <rect x="84" y="323" width="7" height="102" rx="3.5" fill="#0b57d0"/>
    <text x="109" y="352" class="node-title">Operational data</text>
    <text x="109" y="376" class="node-copy">ERP · logistics · inventory</text>
    <text x="109" y="396" class="node-copy">landed-cost CSV files</text>
    <text x="109" y="415" class="tech">STRUCTURED</text>

    <rect x="84" y="500" width="224" height="102" rx="14" fill="#fff" stroke="#dbe3ec"/>
    <rect x="84" y="500" width="7" height="102" rx="3.5" fill="#f28c28"/>
    <text x="109" y="529" class="node-title">Shipping documents</text>
    <text x="109" y="553" class="node-copy">Synthetic SI / Draft BL</text>
    <text x="109" y="573" class="node-copy">User PDFs · quarantined</text>
    <text x="109" y="592" class="tech" fill="#e97919">UNSTRUCTURED</text>
  </g>

  <!-- Snowflake cards: landing -->
  <text x="382" y="336" class="eyebrow" fill="#637083">LAND</text>
  <g filter="url(#softShadow)">
    <rect x="382" y="354" width="168" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="400" y="383" class="node-title">RAW tables</text>
    <text x="400" y="406" class="node-copy">Source-faithful records</text>
    <rect x="382" y="531" width="168" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="400" y="560" class="node-title">Document stages</text>
    <text x="400" y="583" class="node-copy">Source + hash/audit intake</text>
  </g>

  <!-- Snowflake cards: process -->
  <text x="590" y="336" class="eyebrow" fill="#637083">PROCESS</text>
  <g filter="url(#softShadow)">
    <rect x="590" y="354" width="184" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="608" y="382" class="node-title">Dynamic tables</text>
    <text x="608" y="406" class="node-copy">Curate entities + events</text>
    <rect x="590" y="531" width="184" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="608" y="559" class="tech">AI_PARSE_DOCUMENT</text>
    <text x="608" y="583" class="tech">AI_EXTRACT</text>
  </g>

  <!-- Snowflake cards: govern -->
  <text x="814" y="336" class="eyebrow" fill="#637083">GOVERN</text>
  <g filter="url(#softShadow)">
    <rect x="814" y="354" width="184" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="832" y="382" class="node-title">Metric marts</text>
    <text x="832" y="406" class="node-copy">One canonical definition</text>
    <rect x="814" y="443" width="184" height="72" rx="12" fill="#fff" stroke="#bfdaef"/>
    <text x="832" y="471" class="node-title">Snowpark risk</text>
    <text x="832" y="495" class="node-copy">Shipment-risk features</text>
    <rect x="814" y="531" width="184" height="100" rx="12" fill="#fff" stroke="#f0c79e"/>
    <text x="832" y="559" class="node-title">Field comparison</text>
    <text x="832" y="582" class="node-copy">match · mismatch · unresolved</text>
    <line x1="832" y1="593" x2="980" y2="593" stroke="#ead9c8"/>
    <text x="832" y="615" class="tech" fill="#c96c14">DOCUMENT EXCEPTIONS</text>
  </g>

  <!-- Snowflake cards: expose -->
  <text x="1038" y="336" class="eyebrow" fill="#637083">EXPOSE</text>
  <g filter="url(#softShadow)">
    <rect x="1038" y="354" width="194" height="72" rx="12" fill="#fff" stroke="#8dbde4"/>
    <text x="1056" y="381" class="tech">SUPPLY_CHAIN_</text>
    <text x="1056" y="401" class="tech">SEMANTIC_VIEW</text>
    <rect x="1038" y="531" width="194" height="72" rx="12" fill="#fff" stroke="#8dbde4"/>
    <text x="1056" y="560" class="node-title">Evidence retrieval</text>
    <text x="1056" y="583" class="node-copy">Semantic View Â· Search optional</text>
  </g>

  <!-- Agent -->
  <g filter="url(#softShadow)">
    <rect x="1080" y="443" width="152" height="72" rx="14" fill="url(#agent)"/>
    <circle cx="1103" cy="466" r="8" fill="#fff" opacity="0.95"/>
    <path d="M1098 466h10M1103 461v10" stroke="#0b57d0" stroke-width="2" stroke-linecap="round"/>
    <text x="1118" y="470" class="sans" font-size="12" font-weight="800" fill="#fff">VERICARGO</text>
    <text x="1098" y="496" class="sans" font-size="18" font-weight="800" fill="#fff">AGENT</text>
  </g>

  <!-- Experience and action -->
  <text x="1315" y="292" class="eyebrow" fill="#637083">EXPERIENCE &amp; ACTION</text>
  <g filter="url(#softShadow)">
    <rect x="1315" y="354" width="195" height="92" rx="14" fill="#fff" stroke="#dbe3ec"/>
    <rect x="1315" y="354" width="195" height="10" rx="5" fill="#f28c28"/>
    <text x="1335" y="395" class="node-title">Streamlit</text>
    <text x="1335" y="418" class="node-copy">Tower · Shipment 360 · evidence</text>
    <text x="1335" y="436" class="node-copy">Copilot · review · governance</text>

    <rect x="1315" y="504" width="195" height="72" rx="14" fill="#edf5ff" stroke="#79abe0"/>
    <text x="1334" y="533" class="tech">PROPOSE → CONFIRM</text>
    <text x="1334" y="556" class="node-copy">UI-owned guarded mutation</text>

    <rect x="1315" y="623" width="195" height="62" rx="14" fill="#eef8f4" stroke="#82c7ac"/>
    <text x="1334" y="650" class="node-title">Human review</text>
    <text x="1334" y="672" class="node-copy">State + exception links + audit</text>
  </g>

  <!-- Flow connectors -->
  <path class="flow" d="M308 374H382"/>
  <path class="flow" d="M550 390H590"/>
  <path class="flow" d="M774 390H814"/>
  <path class="flow" d="M998 390H1038"/>
  <path class="flow" d="M308 551H382"/>
  <path class="flow" d="M550 567H590"/>
  <path class="flow" d="M774 567H814"/>
  <path class="flow" d="M998 581H1038"/>
  <path class="flow-blue" d="M1232 390h28v72h-28"/>
  <path class="flow-blue" d="M1232 567h28v-70h-28"/>
  <path class="flow" d="M906 426v17"/>
  <path class="flow" d="M906 531v-16"/>
  <path class="flow-blue" d="M1232 479h42v-79h41"/>
  <path class="flow-dashed" d="M1412 446v58"/>
  <rect x="1327" y="465" width="170" height="25" rx="12.5" fill="#fff" stroke="#c7d8ee"/>
  <text x="1412" y="482" class="sans" font-size="11" text-anchor="middle" font-weight="700" fill="#0b57d0">EXPLICIT CONFIRMATION</text>
  <path class="flow" d="M1412 576v47"/>

  <!-- Governed metrics and guardrails -->
  <text x="58" y="755" class="section" fill="#637083">ONE DEFINITION, EVERY PERSONA</text>
  <g class="sans">
    <g transform="translate(58 773)"><rect width="275" height="54" rx="14" fill="#fff" stroke="#dbe3ec"/><circle cx="28" cy="27" r="13" fill="#edf5ff"/><path d="m22 27 4 4 8-10" fill="none" stroke="#0b57d0" stroke-width="2.5" stroke-linecap="round"/><text x="52" y="24" font-size="13" font-weight="800" fill="#172238">ON-TIME DELIVERY</text><text x="52" y="42" font-size="11" fill="#637083">Delivered on/before promise</text></g>
    <g transform="translate(349 773)"><rect width="275" height="54" rx="14" fill="#fff" stroke="#dbe3ec"/><circle cx="28" cy="27" r="13" fill="#edf5ff"/><text x="28" y="32" text-anchor="middle" font-size="14" font-weight="800" fill="#0b57d0">%</text><text x="52" y="24" font-size="13" font-weight="800" fill="#172238">FILL RATE</text><text x="52" y="42" font-size="11" fill="#637083">Capped shipped ÷ ordered</text></g>
    <g transform="translate(640 773)"><rect width="275" height="54" rx="14" fill="#fff" stroke="#dbe3ec"/><circle cx="28" cy="27" r="13" fill="#edf5ff"/><text x="28" y="31" text-anchor="middle" font-size="12" font-weight="800" fill="#0b57d0">30d</text><text x="52" y="24" font-size="13" font-weight="800" fill="#172238">DAYS OF INVENTORY</text><text x="52" y="42" font-size="11" fill="#637083">On-hand ÷ trailing demand</text></g>
    <g transform="translate(931 773)"><rect width="275" height="54" rx="14" fill="#fff" stroke="#dbe3ec"/><circle cx="28" cy="27" r="13" fill="#edf5ff"/><text x="28" y="31" text-anchor="middle" font-size="12" font-weight="800" fill="#0b57d0">$</text><text x="52" y="24" font-size="13" font-weight="800" fill="#172238">LANDED COST</text><text x="52" y="42" font-size="11" fill="#637083">Five governed USD components</text></g>
    <g transform="translate(1222 773)"><rect width="320" height="54" rx="14" fill="#172238"/><circle cx="28" cy="27" r="13" fill="#2b4969"/><path d="M28 19v16M20 27h16" stroke="#fff" stroke-width="2"/><text x="52" y="24" font-size="13" font-weight="800" fill="#fff">EVIDENCE-FIRST GUARDRAILS</text><text x="52" y="42" font-size="11" fill="#c9d5e2">No guesses · confidence · auditability</text></g>
  </g>
  <text x="58" y="865" class="sans" font-size="11" fill="#7b8999">VeriCargo OneTruth · Hackathon reference architecture · Synthetic data only</text>
  <text x="1542" y="865" class="sans" font-size="11" text-anchor="end" fill="#7b8999">Architecture v1.0</text>
