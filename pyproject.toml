[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vericargo-onetruth"
version = "0.1.0"
description = "Governed supply-chain ontology and exception copilot on Snowflake"
requires-python = ">=3.11"
dependencies = [
  "snowflake-snowpark-python>=1.39,<2",
  "streamlit==1.49.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

